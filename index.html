<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アースライン 作業実績</title>
<link rel="preconnect" href="https://static.line-scdn.net">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --ink: #1d2433; --sub: #5f6b7a; --line: #dfe3e8;
    --accent: #0b6bcb; --accent-weak: #e6f0fb; --ok: #1e8e4e; --ok-weak: #e5f5ec;
    --warn: #b26a00; --warn-weak: #fff3dd; --ng: #c62828; --ng-weak: #fdeaea;
    --ok-ink: #145c34; --warn-ink: #6b4300; --ng-ink: #8a1c1c; --field: #fff; --scrim: rgba(255,255,255,.6);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #12161d; --card: #1b212b; --ink: #e6eaf0; --sub: #9aa6b5; --line: #2e3744;
    --accent: #5aa7f0; --accent-weak: #1a2e45; --ok: #5cc98a; --ok-weak: #173325;
    --warn: #e0a64a; --warn-weak: #3a2c12; --ng: #f07a7a; --ng-weak: #3d1b1b;
    --ok-ink: #a6e6c0; --warn-ink: #f3d39b; --ng-ink: #f6b4b4; --field: #141a22; --scrim: rgba(0,0,0,.5); color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #12161d; --card: #1b212b; --ink: #e6eaf0; --sub: #9aa6b5; --line: #2e3744;
    --accent: #5aa7f0; --accent-weak: #1a2e45; --ok: #5cc98a; --ok-weak: #173325;
    --warn: #e0a64a; --warn-weak: #3a2c12; --ng: #f07a7a; --ng-weak: #3d1b1b;
    --ok-ink: #a6e6c0; --warn-ink: #f3d39b; --ng-ink: #f6b4b4; --field: #141a22; --scrim: rgba(0,0,0,.5); color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 16px; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--card); border-bottom: 1px solid var(--line);
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header .t { font-weight: 700; font-size: 15px; }
  header .who { font-size: 13px; color: var(--sub); text-align: right; }
  main { max-width: 560px; margin: 0 auto; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
  h2 { font-size: 19px; margin: 4px 0 12px; }
  h3 { font-size: 15px; margin: 18px 0 8px; color: var(--sub); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .muted { color: var(--sub); font-size: 14px; }
  .big { font-size: 22px; font-weight: 700; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  button, .btn { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 12px 14px; min-height: 48px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
  button:disabled { opacity: .5; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); border-color: var(--accent); color: var(--card); font-weight: 700; width: 100%; font-size: 18px; min-height: 56px; }
  .quick { width: 100%; text-align: left; display: block; background: var(--accent-weak); border: 2px solid var(--accent); padding: 14px; }
  .quick b { display: block; font-size: 18px; color: var(--accent); margin-bottom: 4px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
  .seg button.on, .chip.on { background: var(--accent); border-color: var(--accent); color: var(--card); font-weight: 700; }
  .chip { min-height: 44px; padding: 8px 12px; font-size: 15px; }
  label { display: block; font-size: 14px; color: var(--sub); margin: 14px 0 6px; }
  input, select, textarea { font: inherit; width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); color: var(--ink); min-height: 48px; }
  .amount { font-size: 22px; font-weight: 700; text-align: right; }
  .badge { font-size: 12px; padding: 3px 8px; border-radius: 99px; white-space: nowrap; font-weight: 700; }
  .b-登録済 { background: var(--warn-weak); color: var(--warn); }
  .b-承認済 { background: var(--ok-weak); color: var(--ok); }
  .b-差戻 { background: var(--ng-weak); color: var(--ng); }
  .b-請求済, .b-提出済 { background: var(--accent-weak); color: var(--accent); }
  .item { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .alert { border-radius: 10px; padding: 12px; margin-bottom: 12px; font-size: 15px; }
  .alert.warn { background: var(--warn-weak); color: var(--warn-ink); }
  .alert.ng { background: var(--ng-weak); color: var(--ng-ink); }
  .alert.ok { background: var(--ok-weak); color: var(--ok-ink); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td { padding: 8px 0; border-bottom: 1px solid var(--line); }
  td.r { text-align: right; white-space: nowrap; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line);
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav button { border: 0; border-radius: 0; min-height: 64px; font-size: 12px; white-space: nowrap; padding-inline: 2px; flex-direction: column; gap: 2px; color: var(--sub); background: none; }
  nav button .i { font-size: 20px; }
  nav button.on { color: var(--accent); font-weight: 700; }
  nav.many { grid-auto-columns: minmax(68px, 1fr); overflow-x: auto; }
  nav.many button { font-size: 12px; white-space: nowrap; padding: 8px 4px; }
  .b-未回答, .b-募集中, .b-手挙げ { background: var(--warn-weak); color: var(--warn); }
  .b-確定 { background: var(--ok-weak); color: var(--ok); }
  .b-辞退, .b-見送り, .b-取消, .b-締切 { background: var(--line); color: var(--sub); }
  .check { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .check input { width: 26px; height: 26px; min-height: 0; flex: none; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet .row button { flex: 1; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #222; color: #fff; padding: 12px 18px;
    border-radius: 10px; z-index: 30; font-size: 15px; max-width: 90%; }
  .bar { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; height: 3px; z-index: 30; overflow: hidden; background: var(--accent-weak); }
  .bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; background: var(--accent); animation: barmove 1s ease-in-out infinite; }
  @keyframes barmove { from { left: -40%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; left: 0; width: 100%; opacity: .6; } }
  .saving b::after { content: ""; display: inline-block; width: 14px; height: 14px; margin-left: 8px; vertical-align: -2px; border: 2px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  iframe.inv { width: 100%; height: 520px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
  .persona { width: 100%; text-align: left; margin-bottom: 8px; display: block; }
  .persona small { display: block; color: var(--sub); margin-top: 2px; }
  .hidden { display: none !important; }
  .req { color: var(--ng); font-size: 12px; margin-left: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .stepper:last-child { border-bottom: 0; }
  .stepper .n { min-width: 2.5em; text-align: center; font-size: 18px; font-weight: 700; }
  .stepper button { min-width: 48px; padding: 8px; }
  .help { font-size: 13px; color: var(--sub); margin: 4px 0 0; }
  .dayhead { font-weight: 700; margin: 16px 0 6px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<header><div class="t" id="appName">作業実績</div><div class="who" id="who"></div></header>
<main id="app"><div class="card">読み込み中…</div></main>
<nav id="nav" class="hidden"></nav>
<div id="overlay"></div>
<div id="busy"></div>

<script>
/* ===== 設定（GitHub Pages に置くときだけ書き換える） ===== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbxRvk9DxxnpL0LxUWhCayBxz6WjxTpcy5WLa9w9c8HUYlbFLrYYygqlNbXMEV5vhmgy/exec',          // GASウェブアプリのURL（https://script.google.com/macros/s/……/exec）
  LIFF_ID: '2012354614-iopgXgnC',          // LIFF ID（例：2001234567-AbCdEfGh）
  SEND_CHAT_MESSAGE: true, // 作業登録後、LINEのトークに登録内容を送る（LINE内で開いたときのみ）
};

/* ===== 状態 ===== */
const S = { mode: '', idToken: '', demoUser: '', cacheKey: '', touched: false, me: null, tab: '', acting: false, view: '', data: {}, sites: null,
  form: null, month: {}, inv: null, showInv: false, profile: null,
  app: { name: '', company: '' }, report: null, rform: null, rmode: 'input' };

const DEMO_PERSONAS = [
  { id: 'DEMO-OY001', name: '山田 太郎', desc: '一人親方（登録番号あり・いろいろな現場に行く）' },
  { id: 'DEMO-OY002', name: '高橋 次郎', desc: '一人親方（免税・毎日同じ現場）' },
  { id: 'DEMO-NEW-' + Math.random().toString(36).slice(2, 7), name: '新しい一人親方', desc: 'まだ登録していない人（新規登録を試す）' },
  { id: 'DEMO-ST001', name: '佐藤 健一', desc: '現場責任者（〇〇邸・△△マンション担当）' },
  { id: 'DEMO-ST002', name: '鈴木 誠', desc: '現場責任者（□□小学校・××工場担当）' },
  { id: 'DEMO-ST003', name: '田中 美咲', desc: '事務員（全現場の承認・親方の有効化・請求書の一覧）' },
  { id: 'DEMO-ST006', name: '河村 一也', desc: '従業員（日報の入力だけ）' },
];

/* ===== 道具 ===== */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = (n) => Number(n || 0).toLocaleString('ja-JP') + '円';
const pad = (n) => ('0' + n).slice(-2);
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => ymd(new Date());
const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return ymd(d); };
const thisMonth = () => today().slice(0, 7);
const addMonth = (ym, n) => { const d = new Date(Number(ym.slice(0, 4)), Number(ym.slice(5, 7)) - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const jpDate = (s) => { const d = new Date(s + 'T00:00:00'); return (d.getMonth() + 1) + '/' + d.getDate() + '（' + '日月火水木金土'[d.getDay()] + '）'; };
const jpMonth = (ym) => Number(ym.slice(0, 4)) + '年' + Number(ym.slice(5, 7)) + '月';
const companyName = () => S.app.company || '会社';
const unitText = (w) => w.kind === '請負' ? '請負（一式）' : (w.unit === '時間' ? w.hours + '時間' : w.unit);

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2800);
}
// 通信中の表示：画面は隠さず、上部に細いバーを出すだけ（0.15秒以内に終わる通信では出さない）
let BUSY_N = 0, BUSY_T = null;
function busy(delta) {
  BUSY_N = Math.max(0, BUSY_N + delta);
  clearTimeout(BUSY_T);
  if (BUSY_N > 0) BUSY_T = setTimeout(() => { $('busy').innerHTML = '<div class="bar" role="progressbar" aria-label="通信中"></div>'; }, 150);
  else $('busy').innerHTML = '';
}
function modal(html) { $('overlay').innerHTML = '<div class="modal" id="mbg"><div class="sheet">' + html + '</div></div>';
  $('mbg').addEventListener('click', e => { if (e.target.id === 'mbg') closeModal(); }); }
function closeModal() { $('overlay').innerHTML = ''; }

/* ===== サーバーとの通信 ===== */
function api(action, params) {
  const body = Object.assign({ action }, params || {});
  if (S.demoUser) body.demoUser = S.demoUser; else body.idToken = S.idToken;
  const p = S.mode === 'gas'
    ? new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(body))
    : fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(r => r.json());
  return p.then(r => { if (!r || !r.ok) throw new Error((r && r.error) || '通信に失敗しました'); return r.data; });
}
// 書き込み系の操作（登録・承認など）。終わるまで同じ操作の二重押しを受け付けない
async function act(fn) {
  if (S.acting) { toast('前の操作を処理中です。少しお待ちください'); return; }
  S.acting = true; busy(1);
  try { return await fn(); }
  catch (e) { closeModal(); toast(e.message || String(e)); console.warn(e); }
  finally { S.acting = false; busy(-1); }
}
// 読み込み系の画面表示。前に読んだ内容があればすぐ出し、裏で最新を取りに行って変わっていれば描き直す
async function view(key, action, params, draw) {
  S.view = key; S.touched = false;
  const hit = S.data[key];
  if (hit) draw(hit); else $('app').innerHTML = '<div class="card muted">読み込み中…</div>';
  busy(1);
  try {
    const d = await api(action, params);
    const same = hit && JSON.stringify(hit) === JSON.stringify(d);
    S.data[key] = d;
    if (S.view === key && !same && !S.touched && !S.acting && !document.querySelector('.modal')) draw(d);
  } catch (e) { if (S.view === key) { if (!hit) $('app').innerHTML = '<div class="alert ng">' + esc(e.message || String(e)) + '</div>'; else toast(e.message || String(e)); } }
  finally { busy(-1); }
}
// よく開く画面の内容を、起動直後に裏で先に読み込んでおく
function prefetch(key, action, params) {
  if (S.data[key]) return;
  api(action, params).then(d => { if (!S.data[key]) S.data[key] = d; }).catch(() => {});
}
function prefetchAll() {
  const me = S.me; if (!me) return;
  setTimeout(() => {
    if (me.oyakata && me.oyakata.status === '有効') {
      prefetch('list:' + thisMonth(), 'listWork', { month: thisMonth() });
      prefetch('myreq', 'myRequests', {});
      prefetch('inv:' + addMonth(thisMonth(), -1), 'invoicePreview', { month: addMonth(thisMonth(), -1) });
    }
    if (me.staff && me.staff.role !== '従業員') { prefetch('pending', 'pending', {}); prefetch('sreq:open', 'listRequests', { filter: 'open' }); }
    if (me.staff) prefetch('rlist:' + thisMonth(), 'listReports', { month: thisMonth() });
  }, 300);
}

/* ===== 起動 ===== */
async function boot() {
  const q = new URLSearchParams(location.search);
  if (window.google && google.script && google.script.run) S.mode = 'gas';
  else S.mode = 'liff';

  if (S.mode === 'liff') {
    if (!CONFIG.API_URL || !CONFIG.LIFF_ID) return fatal('index.html の CONFIG（API_URL と LIFF_ID）を設定してください。');
    try {
      await loadScript('https://static.line-scdn.net/liff/edge/2/sdk.js');
      await liff.init({ liffId: CONFIG.LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      S.idToken = liff.getIDToken();
      if (!S.idToken) return fatal('LINEの本人確認ができませんでした。LIFFの設定で「openid」を有効にしてください。');
      try { const t = liff.getDecodedIDToken(); if (t && t.sub) S.cacheKey = 'oyakata-boot:' + t.sub; } catch (e) { /* 覚えておく機能なしで続ける */ }
    } catch (e) { return fatal('LINEとの接続に失敗しました：' + e.message); }
    S.tab = new URLSearchParams(location.search).get('page') || q.get('page') || ''; // リッチメニューの ?page=… （init後に読む）
    return start();
  }
  showPersonas();
}
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.charset = 'utf-8'; s.onload = res; s.onerror = () => rej(new Error('読み込み失敗')); document.head.appendChild(s); });
}
function fatal(msg) { $('app').innerHTML = '<div class="alert ng">' + esc(msg) + '</div>'; }

function showPersonas() {
  S.demoUser = ''; S.me = null; $('nav').classList.add('hidden'); $('who').textContent = 'デモモード';
  $('app').innerHTML = '<h2>デモ：誰として操作しますか？</h2>' +
    '<p class="muted">名前・現場はすべて架空のサンプルです。上の「切替」でいつでも別の人に変えられます。' +
    (window.DEMO_HOOKS ? 'データはこの画面の中だけで、ページを開き直すと最初の状態に戻ります。' : '') + '</p>' +
    DEMO_PERSONAS.map(p => '<button class="persona" data-p="' + esc(p.id) + '"><b>' + esc(p.name) + '</b><small>' + esc(p.desc) + '</small></button>').join('');
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { S.demoUser = b.dataset.p; S.tab = ''; S.sites = null; S.month = {}; S.data = {}; S.form = null; S.report = null; S.rform = null; S.rmode = 'input'; S.sreq = null; start(); });
}

/* 開いたときの読み込み。2回目以降は前回の内容ですぐ画面を出し、裏で最新に差し替える */
function cacheGet() {
  if (!S.cacheKey) return null;
  try { const v = JSON.parse(localStorage.getItem(S.cacheKey) || 'null'); return v && v.me ? v : null; } catch (e) { return null; }
}
function cacheSet(d) {
  if (!S.cacheKey) return;
  // スマホに残すのは画面を出すのに必要な最小限だけ（住所・電話・口座は残さない）
  const o = d.me.oyakata;
  const slim = { me: { demo: d.me.demo, staff: d.me.staff,
    oyakata: o ? { id: o.id, name: o.name, status: o.status, rateDay: o.rateDay, rateHalf: o.rateHalf, rateHour: o.rateHour } : null },
    sites: d.sites, app: d.app || S.app, report: d.report || (S.me && S.me.staff && S.me.staff.role === '従業員' ? S.report : null) };
  try { localStorage.setItem(S.cacheKey, JSON.stringify(slim)); } catch (e) { /* 保存できなくても動く */ }
  return slim;
}
async function start() {
  S.touched = false;
  const cached = cacheGet();
  if (cached) {
    S.me = cached.me; S.sites = cached.sites; setApp(cached.app); if (cached.report) S.report = cached.report;
    render();
    refreshInBackground(JSON.stringify(cached));
    prefetchAll();
    return;
  }
  busy(1);
  try { const d = await api('boot'); S.me = d.me; S.sites = d.sites; setApp(d.app); if (d.report) S.report = d.report; cacheSet(d); }
  catch (e) { busy(-1); return fatal(e.message || String(e)); }
  busy(-1);
  render();
  prefetchAll();
}
function setApp(app) {
  if (!app) return;
  S.app = app;
  if (app.name) { $('appName').textContent = app.name; document.title = app.name; }
}
async function refreshInBackground(before) {
  try {
    const d = await api('boot');
    const slim = cacheSet(d) || d;
    if (JSON.stringify(slim) === before) return;
    S.me = d.me; setApp(d.app);
    // 入力を始めていなければ、最新の内容で画面を描き直す
    if (!S.touched && !S.acting && !document.querySelector('.modal')) { S.sites = d.sites; S.form = null; if (d.report) { S.report = d.report; S.rform = null; } render(); }
    else { if (d.sites) S.sites = d.sites; if (d.report) S.report = d.report; }
  } catch (e) { console.warn('refresh', e); }
}
document.addEventListener('input', () => { S.touched = true; }, true);

function tabsFor(me) {

function drawNav() {

}
function render() {
  const me = S.me;
  const names = [me.oyakata && me.oyakata.name, me.staff && me.staff.name].filter(Boolean);
  $('who').innerHTML = esc(names.join(' / ') || '未登録') +
    (S.demoUser ? ' <button class="chip" id="switch" style="min-height:32px;padding:4px 10px;margin-left:6px">切替</button>' : '');

/* ===== 一人親方：作業登録（確定した依頼から選ぶ。現場の一覧は見せない） ===== */
const UNIT_KEYS = [['day', '1日', 'rateDay'], ['half', '半日', 'rateHalf'], ['hour', '時間', 'rateHour']];
const unitsOf = (j) => UNIT_KEYS.filter(u => j[u[2]] > 0);
const inRange = (j, d) => j.start <= d && d <= j.end;
const periodText = (j) => j.start === j.end ? jpDate(j.start) : jpDate(j.start) + '〜' + jpDate(j.end);
const rateText = (j) => j.kind === '請負' ? '請負 ' + yen(j.amount) : unitsOf(j).map(u => u[1] + ' ' + yen(j[u[2]])).join('・');
async function pageWork() {
  $('app').innerHTML = '<div class="card">読み込み中…</div>';
  if (!S.sites || !S.sites.jobs) {
    S.view = 'work'; busy(1);
    try { S.sites = await api('sites'); } catch (e) { busy(-1); return fatal(e.message || String(e)); }
    busy(-1);
    if (!S.me || S.tab !== 'work') return;
  }
  S.view = 'work'; S.touched = false;
  showWork();
  // 確定した依頼が増えていないか、裏で確かめて変わっていれば描き直す
  const before = JSON.stringify(S.sites);
  busy(1);
  api('sites').then(d => {
    if (JSON.stringify(d) === before) return;
    S.sites = d; if (S.me) cacheSet({ me: S.me, sites: S.sites });
    drawNav();
    if (S.view === 'work' && S.tab === 'work' && !S.touched && !S.acting && !document.querySelector('.modal')) showWork();
  }).catch(e => console.warn('sites', e)).finally(() => busy(-1));
}
function showWork() {
  const jobs = S.sites.jobs;
  if (!S.form || !jobs.some(j => j.id === S.form.reqId)) {
    const j = jobs.find(x => inRange(x, today()) && !x.done) || jobs.find(x => !x.done) || null;
    S.form = j ? newWorkForm(j) : null;
  }
  drawWork();
}
function newWorkForm(j) {
  const d = inRange(j, today()) ? today() : (j.end < today() ? j.end : j.start);
  return { reqId: j.id, date: d > today() ? today() : d, unit: (unitsOf(j)[0] || ['day'])[0], hours: '', note: '' };
}
function workAmount(j, f) {
  if (j.kind === '請負') return j.amount;
  const u = UNIT_KEYS.find(x => x[0] === f.unit);
  if (!u) return 0;
  return u[0] === 'hour' ? (f.hours ? Math.round(j.rateHour * Number(f.hours)) : 0) : j[u[2]];
}
function drawWork() {

    h += '<div class="card"><p><b>確定した依頼がありません。</b></p><p class="muted">作業の登録は、職員から届いた依頼が確定してからできます。依頼がないのに作業した日は、職員へ連絡してください（職員があとから依頼を作ります）。</p></div>';

    jobs.map(x => '<button class="persona' + (x.id === j.id ? ' on' : '') + '" data-job="' + esc(x.id) + '" style="' + (x.id === j.id ? 'border:2px solid var(--accent);background:var(--accent-weak)' : '') + '">' +
      '<b>' + esc(x.siteName) + '</b><small>' + esc(x.kind + '・' + periodText(x) + '・' + rateText(x)) + (x.done ? '・完了報告済み' : '') + '</small></button>').join('');
  if (j.kind === '請負') {

      '<div class="between" style="margin-top:14px"><span>請負金額（税抜）</span><span class="big">' + esc(yen(j.amount)) + '</span></div>' +

      '<div style="height:16px"></div><button class="primary" id="save"' + (j.done ? ' disabled' : '') + '>' + (j.done ? '完了報告済みです' : '工事の完了を報告する') + '</button>' +
      '<p class="muted">責任者が完了を確認して承認すると、完了日の月の請求書に入ります。</p></div>';
  } else {

  $('app').innerHTML = h;
  if ($('toReq')) $('toReq').onclick = () => { S.tab = 'req'; render(); };
  document.querySelectorAll('[data-quick]').forEach(b => b.onclick = () => {
    const x = todays[Number(b.dataset.quick)], u = unitsOf(x).find(y => y[0] !== 'hour');
    saveWork({ reqId: x.id, date: today(), unit: u[0] }, x);
  });
  document.querySelectorAll('[data-job]').forEach(b => b.onclick = () => { const x = jobs.find(y => y.id === b.dataset.job); S.form = newWorkForm(x); drawWork(); });
  document.querySelectorAll('[data-date]').forEach(b => b.onclick = () => { f.date = b.dataset.date; drawWork(); });
  if ($('date')) $('date').onchange = (e) => { f.date = e.target.value; drawWork(); };
  document.querySelectorAll('[data-unit]').forEach(b => b.onclick = () => { f.unit = b.dataset.unit; drawWork(); });
  if ($('hours')) $('hours').oninput = (e) => { f.hours = e.target.value; $('amountView').textContent = yen(workAmount(j, f)); };
  $('note').oninput = (e) => { f.note = e.target.value; };
  $('save').onclick = () => {
    if (!f.date) return toast('日付を選んでください');
    if (f.date < j.start || f.date > j.end) return toast('依頼の期間（' + periodText(j) + '）の日付を選んでください');
    if (j.kind === '応援' && f.unit === 'hour' && !f.hours) return toast('時間数を入力してください');

// 押した瞬間に結果の画面へ切り替え、保存が終わったら「登録しました」に変える
function saveWork(p, job, force) {
  if (S.acting) return toast('前の登録を保存中です。少しお待ちください');
  const label = job.kind === '請負' ? '請負（完了報告）' : (({ day: '1日', half: '半日', hour: (p.hours || '') + '時間' })[p.unit] || '');
  const formBackup = S.form;
  S.form = null;
  $('app').innerHTML = '<div class="alert saving" id="saveState" style="font-size:17px;background:var(--accent-weak);color:var(--ink)"><b>保存しています</b><br>' +
    esc(jpDate(p.date) + ' ' + job.siteName + ' ' + label) + '</div>' +
    '<button class="primary" id="again">続けて登録する</button><div style="height:8px"></div>' +
    '<button style="width:100%" id="toList">今月の実績を見る</button>' +
    (S.mode === 'liff' ? '<div style="height:8px"></div><button style="width:100%" id="close" disabled>保存が終わると閉じられます</button>' : '');
  window.scrollTo(0, 0);
  $('again').onclick = () => pageWork();
  $('toList').onclick = () => { S.tab = 'list'; render(); };
  act(async () => {
    let r;
    try { r = await api('addWork', Object.assign({}, p, force ? { force: true } : {})); }
    catch (e) {
      S.form = formBackup;
      $('app').innerHTML = '<div class="alert ng" style="font-size:17px"><b>登録できませんでした</b><br>' + esc(e.message || String(e)) + '</div>' +
        '<button class="primary" id="retry">入力画面に戻る</button>';
      $('retry').onclick = () => (S.form ? drawWork() : pageWork());
      window.scrollTo(0, 0);
      return;
    }
    if (r.duplicate) {
      S.form = formBackup;
      modal('<h3 style="margin-top:0;color:var(--ink)">同じ日・同じ現場の登録があります</h3><p>' + esc(r.message) + '</p>' +
        '<div class="row"><button id="mNo">やめる</button><button id="mYes" class="primary" style="width:auto">登録する</button></div>');
      $('mNo').onclick = () => { closeModal(); if (S.tab === 'work') (S.form ? drawWork() : pageWork()); };
      $('mYes').onclick = () => { closeModal(); saveWork(p, job, true); };
      if ($('saveState')) $('saveState').outerHTML = '<div class="alert warn" id="saveState"><b>まだ登録していません</b><br>確認の画面で選んでください。</div>';
      return;
    }
    if (r.kind === '請負' && S.sites && S.sites.jobs) {
      const x = S.sites.jobs.find(y => y.id === r.reqId); if (x) x.done = true;
      if (S.me) cacheSet({ me: S.me, sites: S.sites });
    }
    // 今月の実績の一覧にも、手元で1行足しておく（開いたときにすぐ出る）
    const lk = 'list:' + r.date.slice(0, 7), list = S.data[lk];
    if (list) {
      const rows = list.rows.concat([{ id: r.id, date: r.date, siteId: r.siteId, siteName: r.siteName, kind: r.kind,
        unit: r.unit, hours: r.hours, amount: r.amount, note: p.note || '', status: '登録済', reason: '', invoiceId: '', reqId: r.reqId }])
        .sort((a, b) => (a.status === '差戻' ? -1 : 0) - (b.status === '差戻' ? -1 : 0) || a.date.localeCompare(b.date));
      S.data[lk] = Object.assign({}, list, { rows: rows, total: list.total + r.amount });
    }
    const text = '【作業登録】' + jpDate(r.date) + ' ' + r.siteName + ' ' + (r.kind === '請負' ? '請負（完了報告）' : r.unit === '時間' ? r.hours + '時間' : r.unit) + ' ' + yen(r.amount);
    if ($('saveState')) {
      $('saveState').outerHTML = '<div class="alert ok" id="saveState" style="font-size:17px"><b>登録しました ✓</b><br>' + esc(text.replace('【作業登録】', '')) + '</div>';
      if ($('close')) { $('close').disabled = false; $('close').textContent = '閉じる'; $('close').onclick = () => liff.closeWindow(); }
    } else {
      toast('登録しました：' + text.replace('【作業登録】', ''));
    }
    if (S.mode === 'liff' && CONFIG.SEND_CHAT_MESSAGE && liff.isInClient()) {
      try { await liff.sendMessages([{ type: 'text', text: text }]); } catch (e) { console.warn('sendMessages', e); }
    }
  });
}

    (body || '') + '</div>';
}
function pageReq() { view('myreq', 'myRequests', {}, drawReq); }
function drawReq(d) {
  const by = (s) => d.rows.filter(x => s.indexOf(x.my) >= 0);
  const todo = by(['未回答']), wait = by(['手挙げ']), fixed = by(['確定']), done = by(['辞退', '見送り', '取消', '締切']);

    '<div style="text-align:right;margin-top:8px"><button class="chip" data-go="' + esc(x.id) + '">' + (x.kind === '請負' ? '完了を報告する' : 'この依頼で作業登録') + '</button></div>')).join('');
  if (wait.length) h += '<h3>職員の確定待ち</h3>' + wait.map(x => reqCard(x,

    S.data.myreq = opt; drawReq(opt);
    act(async () => {

        toast(ok ? '受けたいと伝えました。確定したら現場が表示されます' : '辞退しました');

  document.querySelectorAll('[data-yes]').forEach(b => b.onclick = () => answer(b.dataset.yes, true));
  document.querySelectorAll('[data-no]').forEach(b => b.onclick = () => answer(b.dataset.no, false));
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = async () => {
    // 確定したばかりの依頼は作業登録の一覧にまだ無いことがあるので、読み直してから開く

    '<div class="seg" style="margin-bottom:12px">' + [['open', '募集中'], ['confirmed', '確定'], ['all', 'すべて']].map(x => '<button data-f="' + x[0] + '" class="' + (st.filter === x[0] ? 'on' : '') + '">' + x[1] + '</button>').join('') + '</div>';
  if (!d.rows.length) h += '<div class="card"><p class="muted">この条件の依頼はありません。</p></div>';
  d.rows.forEach(x => {
    const open = st.open === x.id;
    h += '<div class="card"><div class="between"><b>' + esc(x.kind) + '　' + esc(periodText(x)) + '</b><span class="badge b-' + esc(x.status) + '">' + esc(x.status) + '</span></div>' +
      '<div>' + esc(x.siteName) + '</div><div class="muted">' + esc(rateText(x)) + (x.kind === '応援' ? '・必要 ' + x.people + '人' : '') + '</div>' +
      '<div class="muted" style="margin-top:4px">送り先：' + esc(x.to) + '</div>' +
      '<div class="between" style="margin-top:6px"><span>手挙げ <b>' + cnt(x, '手挙げ') + '</b>・確定 <b>' + cnt(x, '確定') + '</b>・未回答 ' + cnt(x, '未回答') + '・辞退 ' + cnt(x, '辞退') + '</span>' +
      '<button class="chip" data-open="' + esc(x.id) + '">' + (open ? '閉じる' : '返事を見る') + '</button></div>';
    if (open) {
      const order = { '手挙げ': 0, '確定': 1, '未回答': 2, '見送り': 3, '辞退': 4, '取消': 5 };
      const can = x.status !== '取消';
      h += '<div style="margin-top:8px">' + x.answers.slice().sort((a, b) => order[a.status] - order[b.status]).map(a =>
        '<label class="check" style="color:var(--ink);margin:0">' +
        (can && ['手挙げ', '未回答', '確定'].indexOf(a.status) >= 0 ? '<input type="checkbox" data-oy="' + esc(a.oyId) + '"' + (a.status === '確定' ? ' checked disabled' : '') + '>' : '<span style="width:26px"></span>') +
        '<span style="flex:1">' + esc(a.name) + '</span><span class="badge b-' + esc(a.status) + '">' + esc(a.status) + '</span></label>').join('') + '</div>' +
        (can ? '<div style="height:10px"></div><button class="primary" data-confirm="' + esc(x.id) + '">チェックした人で確定する</button>' +
          '<p class="muted">確定すると、選ばれた親方に現場名が表示されます。選ばれなかった人は「見送り」になります。</p>' +
          '<button style="width:100%;color:var(--ng)" data-cancel="' + esc(x.id) + '">この依頼を取り消す</button>' : '');
    }
    h += '</div>';
  });
  $('app').innerHTML = h;
  $('newReq').onclick = () => { st.creating = true; st.f = null; pageSreq(); };
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { st.filter = b.dataset.f; st.open = ''; pageSreq(); });
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { st.open = st.open === b.dataset.open ? '' : b.dataset.open; drawSreq(S.data[key] || d); });
  const run = (action, params, msg) => act(async () => {
    try {
      const r = await api(action, Object.assign({ filter: st.filter }, params));
      S.data[key] = r; if (S.view === key) drawSreq(r); toast(typeof msg === 'function' ? msg(r) : msg);
    } catch (e) { if (S.view === key) drawSreq(S.data[key] || d); throw e; }
  });
  document.querySelectorAll('[data-confirm]').forEach(b => b.onclick = () => {
    const ids = Array.from(document.querySelectorAll('[data-oy]')).filter(c => c.checked).map(c => c.dataset.oy);
    if (!ids.length) return toast('確定する親方にチェックを入れてください');
    b.disabled = true; b.textContent = '確定しています…';
    run('confirmRequest', { id: b.dataset.confirm, ids: ids }, r => r.confirmed + '人を確定しました');
  });
  document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => {
    modal('<p style="margin-top:0">この依頼を取り消しますか？確定した親方にも取消と表示されます。</p>' +
      '<div class="row"><button id="mNo">やめる</button><button id="mYes" class="primary" style="width:auto;background:var(--ng);border-color:var(--ng)">取り消す</button></div>');
    $('mNo').onclick = closeModal;
    $('mYes').onclick = () => { closeModal(); run('cancelRequest', { id: b.dataset.cancel }, '取り消しました'); };
  });
}
function drawSreqForm(form) {
  const st = S.sreq;
  if (!st.f) st.f = { kind: '応援', siteId: '', start: today(), end: '', content: '', rateDay: '', rateHalf: '', rateHour: '', amount: '', people: 1, deadline: '', mode: 'person', ids: [], tags: [], after: false };
  const f = st.f;
  const targets = f.mode === 'tag' ? form.oyakata.filter(o => o.tags.some(t => f.tags.indexOf(t) >= 0)) : form.oyakata.filter(o => f.ids.indexOf(o.id) >= 0);
  const v = (k) => esc(f[k] === undefined || f[k] === null ? '' : f[k]);
  let h = '<h2>新しい依頼</h2><div class="card">' +
    '<label>種類</label><div class="seg">' + ['応援', '請負'].map(k => '<button data-kind="' + k + '" class="' + (f.kind === k ? 'on' : '') + '">' + k + '</button>').join('') + '</div>' +
    '<label for="qsite">現場</label><select id="qsite"><option value="">現場を選んでください</option>' + form.sites.map(s => '<option value="' + esc(s.id) + '"' + (f.siteId === s.id ? ' selected' : '') + '>' + esc(s.name) + (s.area ? '（' + esc(s.area) + '）' : '') + '</option>').join('') + '</select>' +
    '<p class="muted" style="margin:6px 0 0">親方には確定するまで「地域」だけが見えます。地域・住所は現場マスタで入力します。</p>' +
    '<div class="row"><div style="flex:1"><label for="qstart">' + (f.kind === '請負' ? '着工日' : '開始日') + '</label><input type="date" id="qstart" value="' + v('start') + '"></div>' +
    '<div style="flex:1"><label for="qend">' + (f.kind === '請負' ? '完了予定日' : '終了日（1日なら空欄）') + '</label><input type="date" id="qend" value="' + v('end') + '"></div></div>' +
    '<label for="qcontent">内容</label><input id="qcontent" maxlength="200" value="' + v('content') + '" placeholder="' + (f.kind === '請負' ? '例：2階トイレの給排水一式' : '例：給排水の配管、8時集合') + '">';
  if (f.kind === '応援') {
    h += '<label>単価（税抜・使うものだけ）</label><div class="row">' +
      [['rateDay', '1日'], ['rateHalf', '半日'], ['rateHour', '1時間']].map(x => '<div style="flex:1"><label for="' + x[0] + '" style="margin-top:0">' + x[1] + '</label><input id="' + x[0] + '" type="number" inputmode="numeric" value="' + v(x[0]) + '"></div>').join('') + '</div>' +
      '<label for="qpeople">必要人数</label><input id="qpeople" type="number" inputmode="numeric" min="1" max="50" value="' + v('people') + '">';
  } else {
    h += '<label for="qamount">請負金額（税抜）</label><input id="qamount" class="amount" type="number" inputmode="numeric" value="' + v('amount') + '">';
  }
  h += '<label for="qdeadline">返事の期限（任意）</label><input type="date" id="qdeadline" value="' + v('deadline') + '"></div>' +
    '<div class="card"><b>送り先</b><div class="seg" style="margin-top:8px">' + [['person', '個人を選ぶ'], ['tag', 'タグで一斉に']].map(x => '<button data-mode="' + x[0] + '" class="' + (f.mode === x[0] ? 'on' : '') + '"' + (f.after && x[0] === 'tag' ? ' disabled' : '') + '>' + x[1] + '</button>').join('') + '</div>';
  if (f.mode === 'tag') {
    h += form.tags.length ? '<div class="chips" style="margin-top:10px">' + form.tags.map(t => '<button class="chip ' + (f.tags.indexOf(t) >= 0 ? 'on' : '') + '" data-tag="' + esc(t) + '">' + esc(t) + '</button>').join('') + '</div>'
      : '<p class="muted">タグがまだありません。親方マスタの「タグ」列に「A、配管」のように入力してください。</p>';
  } else {
    h += '<div style="margin-top:8px">' + (form.oyakata.length ? form.oyakata.map(o => '<label class="check" style="color:var(--ink);margin:0"><input type="checkbox" data-pick="' + esc(o.id) + '"' + (f.ids.indexOf(o.id) >= 0 ? ' checked' : '') + '><span style="flex:1">' + esc(o.name) + '</span><span class="muted">' + esc(o.tags.join('・')) + '</span></label>').join('') : '<p class="muted">有効な親方がいません。</p>') + '</div>';
  }
  h += '<p id="qcount" style="margin:10px 0 0"><b>' + targets.length + '人</b>に届きます</p>' +
    '<label class="check" style="color:var(--ink);border:0;margin-top:8px"><input type="checkbox" id="qafter"' + (f.after ? ' checked' : '') + '><span>あとから作る（もう作業が終わった日。選んだ親方に確定済みで届きます）</span></label></div>' +
    '<button class="primary" id="qsend">' + (f.after ? '確定済みで作成する' : '依頼を出す') + '</button><div style="height:8px"></div><button style="width:100%" id="qback">戻る</button>';
  $('app').innerHTML = h;
  const bindIn = (id, k) => { if ($(id)) $(id).oninput = (e) => { f[k] = e.target.value; }; };
  bindIn('qcontent', 'content'); bindIn('rateDay', 'rateDay'); bindIn('rateHalf', 'rateHalf'); bindIn('rateHour', 'rateHour');
  bindIn('qamount', 'amount'); bindIn('qpeople', 'people');
  $('qsite').onchange = (e) => { f.siteId = e.target.value; };
  ['qstart', 'qend', 'qdeadline'].forEach(id => { $(id).onchange = (e) => { f[{ qstart: 'start', qend: 'end', qdeadline: 'deadline' }[id]] = e.target.value; }; });
  document.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { f.kind = b.dataset.kind; drawSreqForm(form); });
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { f.mode = b.dataset.mode; drawSreqForm(form); });
  document.querySelectorAll('[data-tag]').forEach(b => b.onclick = () => { const t = b.dataset.tag; f.tags = f.tags.indexOf(t) >= 0 ? f.tags.filter(x => x !== t) : f.tags.concat([t]); drawSreqForm(form); });
  document.querySelectorAll('[data-pick]').forEach(c => c.onchange = () => {
    f.ids = Array.from(document.querySelectorAll('[data-pick]')).filter(x => x.checked).map(x => x.dataset.pick);
    $('qcount').innerHTML = '<b>' + f.ids.length + '人</b>に届きます';
  });
  $('qafter').onchange = (e) => { f.after = e.target.checked; if (f.after) f.mode = 'person'; drawSreqForm(form); };
  $('qback').onclick = () => { st.creating = false; pageSreq(); };
  $('qsend').onclick = () => {
    if (!f.siteId) return toast('現場を選んでください');
    if (!targets.length && !(f.mode === 'person' && f.ids.length)) return toast('送り先を選んでください');
    const btn = $('qsend'); btn.disabled = true; btn.textContent = '送っています…';
    act(async () => {
      try {
        st.filter = f.after ? 'confirmed' : 'open';
        const r = await api('createRequest', Object.assign({}, f, { filter: st.filter }));
        S.data['sreq:' + st.filter] = r; st.creating = false; st.f = null; st.open = r.createdId;
        toast(f.after ? '確定済みの依頼を作りました' : r.sent + '人に依頼を出しました');
        pageSreq();
      } catch (e) { if ($('qsend')) { btn.disabled = false; btn.textContent = f.after ? '確定済みで作成する' : '依頼を出す'; } throw e; }
    });
  };
}

/* ===== 一人親方：今月の実績 ===== */
function monthNav(key, def, onChange) {
  if (!S.month[key]) S.month[key] = def;
  const m = S.month[key];
  return { m, html: '<div class="between" style="margin-bottom:12px"><button id="mPrev">◀ 前の月</button><b style="font-size:18px">' + jpMonth(m) + '</b>' +
    '<button id="mNext"' + (m >= thisMonth() ? ' disabled' : '') + '>次の月 ▶</button></div>',
    bind: () => { $('mPrev').onclick = () => { S.month[key] = addMonth(m, -1); onChange(); }; $('mNext').onclick = () => { S.month[key] = addMonth(m, 1); onChange(); }; } };
}
function pageList() {
  const nav = monthNav('list', thisMonth(), pageList);
  view('list:' + nav.m, 'listWork', { month: nav.m }, d => drawList(d, nav));
}
function drawList(data, nav) {
  const key = 'list:' + nav.m;
  let h = '<h2>実績の一覧</h2>' + nav.html +
    '<div class="card between"><span>合計（税抜・' + data.rows.length + '件）</span><span class="big">' + yen(data.total) + '</span></div>';
  const rej = data.rows.filter(r => r.status === '差戻').length;
  if (rej) h += '<div class="alert ng">差戻が' + rej + '件あります。理由を確認し、取り消して登録し直してください。</div>';
  h += '<div class="card">' + (data.rows.length ? data.rows.map(r =>
    '<div class="item"><div class="between"><b>' + esc(jpDate(r.date)) + '</b><span class="badge b-' + esc(r.status) + '">' + esc(r.status) + '</span></div>' +
    '<div>' + esc(r.siteName) + '</div><div class="between"><span class="muted">' + esc(unitText(r)) + (r.note ? '・' + esc(r.note) : '') + '</span><b>' + esc(yen(r.amount)) + '</b></div>' +
    (r.status === '差戻' ? '<div class="alert ng" style="margin:8px 0 0">差戻理由：' + esc(r.reason) + '</div>' : '') +
    ((r.status === '登録済' || r.status === '差戻') ? '<div style="text-align:right;margin-top:6px"><button class="chip" data-cancel="' + esc(r.id) + '">取り消す</button></div>' : '') +
    '</div>').join('') : '<p class="muted">この月の登録はありません。</p>') + '</div>' +
    '<p class="muted">承認前の実績は取り消して登録し直せます。承認済みの修正は事務へ連絡してください。</p>';
  $('app').innerHTML = h;
  nav.bind();
  document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => {
    const r = data.rows.find(x => x.id === b.dataset.cancel);
    modal('<p style="margin-top:0">' + esc(jpDate(r.date) + ' ' + r.siteName + ' ' + unitText(r)) + ' を取り消しますか？</p>' +
      '<div class="row"><button id="mNo">やめる</button><button id="mYes" class="primary" style="width:auto;background:var(--ng);border-color:var(--ng)">取り消す</button></div>');
    $('mNo').onclick = closeModal;
    $('mYes').onclick = () => {
      closeModal();
      const prev = S.data[key] || data;
      const opt = Object.assign({}, prev, { rows: prev.rows.filter(x => x.id !== r.id), total: prev.total - r.amount });
      S.data[key] = opt; drawList(opt, nav);
      act(async () => {
        try {
          const d = await api('cancelWork', { id: r.id, month: nav.m });
          S.data[key] = d; if (S.view === key) drawList(d, nav); toast('取り消しました');
        } catch (e) { S.data[key] = prev; if (S.view === key) drawList(prev, nav); throw e; }
      });
    };
  });
}

/* ===== 一人親方：請求書 ===== */
function pageInvoice() {
  const nav = monthNav('invoice', addMonth(thisMonth(), -1), () => { S.showInv = false; pageInvoice(); });
  view('inv:' + nav.m, 'invoicePreview', { month: nav.m }, d => drawInvoice(d, nav));
}
function drawInvoice(d, nav) {
  const key = 'inv:' + nav.m;
  const invs = d.invoices || [];
  const siteTable = (x) => '<table>' + x.bySite.map(s => '<tr><td>' + esc(s.siteName) + '<div class="muted">' + (s.days ? s.days + '日' : '') + '（' + s.count + '件）</div></td><td class="r">' + esc(yen(s.amount)) + '</td></tr>').join('') +
    '<tr><td>小計（税抜）</td><td class="r">' + esc(yen(x.subtotal)) + '</td></tr><tr><td>消費税</td><td class="r">' + esc(yen(x.tax)) + '</td></tr>' +
    '<tr><td><b>ご請求金額</b></td><td class="r big">' + esc(yen(x.total)) + '</td></tr></table>';
  let h = '<h2>請求書</h2>' + nav.html;
  // 提出済みの請求書（追加の請求書があれば複数）
  invs.forEach((inv, i) => {
    const open = S.showInv === 'inv' + i;
    h += '<div class="card"><div class="between"><b>' + esc(inv.invoiceId) + '</b><span class="badge b-提出済">提出済</span></div>' +
      '<div class="between"><span class="muted">' + esc(inv.submittedAt) + '・' + inv.count + '件</span><b>' + esc(yen(inv.total)) + '</b></div>' +
      '<div style="text-align:right;margin-top:8px"><button class="chip" data-view="inv' + i + '">' + (open ? '閉じる' : '請求書を見る') + '</button></div>' +
      (open ? '<div style="height:8px"></div><iframe class="inv" data-frame="' + i + '"></iframe>' : '') + '</div>';
  });
  if (d.count) {
    if (invs.length) h += '<h3>追加の請求書（提出後に承認された分）</h3>';
    if (d.unapproved) h += '<div class="alert warn">未承認の実績が' + d.unapproved + '件あります。請求書には承認済みの分だけが入ります。' + (d.canSubmit ? '承認を待つ場合は、提出せずに待ってください。' : '') + '</div>';
    if (!d.canSubmit && !d.closed) h += '<div class="alert warn"><b>' + Number(nav.m.slice(5, 7)) + '月分は、月末の締めが過ぎてから（' + esc(d.closeDate) + '以降）提出できます。</b><br>それまでに承認された分も、まとめてこの請求書に入ります。今は内容の確認だけできます。</div>';
    h += '<div class="card">' + siteTable(d) + '</div>' +
      '<button style="width:100%" data-view="new">' + (S.showInv === 'new' ? '請求書のイメージを閉じる' : '請求書のイメージを見る') + '</button>' +
      (S.showInv === 'new' ? '<div style="height:8px"></div><iframe class="inv" data-frame="new"></iframe>' : '') +
      (d.canSubmit ? '<div style="height:12px"></div><button class="primary" id="submit">' + (invs.length ? '追加の請求書を提出する' : 'この内容で請求書を提出する') + '</button>' +
        '<p class="muted">提出すると、' + esc(companyName()) + '指定の書式でPDFが作られ、事務に届きます。</p>' : '');
  } else if (!invs.length) {
    h += '<div class="card"><p>この月の承認済みの実績はまだありません。</p>' + (d.unapproved ? '<p class="muted">未承認：' + d.unapproved + '件（現場責任者の承認待ち）</p>' : '') + '</div>';
  } else {
    h += d.unapproved ? '<div class="alert warn">未承認の実績が' + d.unapproved + '件あります。承認されると、追加の請求書として提出できます。</div>'
      : '<p class="muted">追加で請求する実績はありません。</p>';
  }
  $('app').innerHTML = h;
  nav.bind();
  document.querySelectorAll('iframe[data-frame]').forEach(f => { const k = f.dataset.frame; f.srcdoc = k === 'new' ? d.html : invs[Number(k)].html; });
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { S.showInv = S.showInv === b.dataset.view ? false : b.dataset.view; drawInvoice(S.data[key] || d, nav); });
  if ($('submit')) $('submit').onclick = () => {
    modal('<p style="margin-top:0"><b>' + esc(jpMonth(nav.m)) + '分 ' + esc(yen(d.total)) + '</b> の' + (invs.length ? '追加の' : '') + '請求書を提出します。提出後は変更できません。よろしいですか？</p>' +
      '<div class="row"><button id="mNo">やめる</button><button id="mYes" class="primary" style="width:auto">提出する</button></div>');
    $('mNo').onclick = closeModal;
    $('mYes').onclick = () => {
      closeModal();
      if ($('submit')) { $('submit').disabled = true; $('submit').textContent = '提出しています（PDFを作成中）…'; }
      act(async () => {
        try {
          const r = await api('submitInvoice', { month: nav.m });
          S.data[key] = r; delete S.data['list:' + nav.m]; S.showInv = false;
          toast('提出しました（' + r.invoiceId + '）');
          if (S.view === key) drawInvoice(r, nav);
        } catch (e) { if (S.view === key) drawInvoice(S.data[key] || d, nav); throw e; }
      });
    };
  };
}

/* ===== 一人親方：登録情報 ===== */
function pageProfile() {
  if (!S.me.oyakata) { S.view = 'profile-new'; return drawProfile({}, true); }
  view('profile', 'profile', {}, p => drawProfile(p, false));
}
function drawProfile(p, isNew) {
  const v = (k) => esc(p[k] === undefined || p[k] === null || p[k] === 0 ? '' : p[k]);
  const field = (id, label, attrs, val) => '<label for="' + id + '">' + label + '</label><input id="' + id + '" ' + (attrs || '') + ' value="' + (val || '') + '">';
  let h = '<h2>' + (isNew ? '一人親方の新規登録' : '登録情報') + '</h2>';
  if (!isNew && p.status === '申請中') h += '<div class="alert warn">事務の確認待ちです。確認が終わると作業の登録ができるようになります。</div>';
  h += '<div class="card"><b>請求書に載る情報</b>' +
    field('name', '氏名 *', 'maxlength="40" autocomplete="name"', v('name')) +

/* ===== 職員：承認 ===== */
function pageApprove() {
  view('pending', 'pending', {}, drawApprove);
}
function drawApprove(d) {
  let h = '<h2>作業実績の確認</h2>';
  if (!d.rows.length) {
    h += '<div class="card"><p>確認待ちの実績はありません。</p><p class="muted">' + (d.siteCount === null ? '全現場' : '担当現場 ' + d.siteCount + 'か所') + 'の分を表示しています。</p></div>';
    $('app').innerHTML = h; return;
  }
  h += '<p class="muted">間違いがなければ「まとめて承認」を押してください。違うものはチェックを外して「差戻」へ。</p>';
  const groups = {};
  d.rows.forEach(r => { const k = r.date + '|' + r.siteName; (groups[k] = groups[k] || []).push(r); });
  Object.keys(groups).forEach(k => {
    const [date, site] = k.split('|');
    h += '<div class="card"><div class="between"><b>' + esc(jpDate(date)) + '</b><span class="muted">' + groups[k].length + '人</span></div><div>' + esc(site) + '</div>' +
      groups[k].map(r => '<label class="check" style="color:var(--ink);margin:0"><input type="checkbox" data-id="' + esc(r.id) + '" checked>' +
        '<span style="flex:1"><b>' + esc(r.name) + '</b>　' + esc(unitText(r)) + (r.note ? '<br><span class="muted">' + esc(r.note) + '</span>' : '') + '</span>' +
        (d.showAmount ? '<span>' + esc(yen(r.amount)) + '</span>' : '') + '</label>').join('') + '</div>';
  });
  h += '<button class="primary" id="ok">チェックしたものをまとめて承認</button><div style="height:8px"></div>' +
    '<button style="width:100%;color:var(--ng)" id="ng">チェックを外したものを差戻</button>';
  $('app').innerHTML = h;
  const ids = (checked) => Array.from(document.querySelectorAll('[data-id]')).filter(c => c.checked === checked).map(c => c.dataset.id);
  // 押した瞬間に一覧から消し、結果はあとで反映する（失敗したら元に戻す）
  const decide = (action, sel, extra, doneMsg) => {
    const prev = S.data.pending || d;
    const opt = Object.assign({}, prev, { rows: prev.rows.filter(x => sel.indexOf(x.id) < 0) });
    S.data.pending = opt; drawApprove(opt);
    act(async () => {
      try {
        const r = await api(action, Object.assign({ ids: sel }, extra));
        S.data.pending = r.pending; if (S.view === 'pending') drawApprove(r.pending); toast(r.count + doneMsg);
      } catch (e) { S.data.pending = prev; if (S.view === 'pending') drawApprove(prev); throw e; }
    });
  };
  $('ok').onclick = () => {
    const sel = ids(true); if (!sel.length) return toast('承認するものにチェックを入れてください');
    decide('approve', sel, {}, '件を承認しました');
  };
  $('ng').onclick = () => {
    const sel = ids(false); if (!sel.length) return toast('差戻すもののチェックを外してください');
    modal('<h3 style="margin-top:0;color:var(--ink)">' + sel.length + '件を差戻します。理由は？</h3><div class="row">' +
      (d.reasons || ['日付違い', '現場違い', '作業量違い', '来ていない', 'その他']).map(x => '<button class="chip" data-r="' + esc(x) + '">' + esc(x) + '</button>').join('') +
      '</div><label>ひとこと（任意）</label><input id="memo" maxlength="60" placeholder="例：13日でした"><div style="height:12px"></div>' +
      '<div class="row"><button id="mNo">やめる</button><button id="mYes" class="primary" style="width:auto;background:var(--ng);border-color:var(--ng)">差戻す</button></div>');
    let reason = '';
    document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { reason = b.dataset.r; document.querySelectorAll('[data-r]').forEach(x => x.classList.toggle('on', x === b)); });
    $('mNo').onclick = closeModal;
    $('mYes').onclick = () => {
      if (!reason) return toast('理由を選んでください');
      const memo = $('memo').value; closeModal();
      decide('reject', sel, { reason: reason, memo: memo }, '件を差戻しました');
    };
  };
}

/* ===== 日報（従業員・責任者・事務） ===== */
// 入力項目は「日報項目」シートで決まる。ここは種類ごとの部品を並べるだけ
const toMin = (v) => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(v || '').trim()); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
function autoHours(t, breakMin) {
  const s = toMin(t.start), e = toMin(t.end);
  if (s === null || e === null) return '';
  let span = e - s; if (span <= 0) span += 24 * 60;
  return Math.round(Math.max(0, span - (span >= 360 ? breakMin : 0)) / 15) * 0.25;
}
function pageReport() {
  const head = () => '<h2>日報</h2><div class="seg" style="margin-bottom:12px">' +
    '<button data-rmode="input" class="' + (S.rmode === 'input' ? 'on' : '') + '">入力する</button>' +
    '<button data-rmode="list" class="' + (S.rmode === 'list' ? 'on' : '') + '">今月の日報</button></div>';
  S.reportHead = head;
  if (S.rmode === 'list') return pageReportList();
  if (S.report && !S.data.rform) S.data.rform = S.report;
  view('rform', 'reportForm', {}, (d) => { S.report = d; drawReport(); });
}
function bindReportHead() {
  document.querySelectorAll('[data-rmode]').forEach(b => b.onclick = () => { S.rmode = b.dataset.rmode; pageReport(); });
}
function newReportForm(keep) {
  return { date: keep ? keep.date : today(), siteId: keep ? keep.siteId : '', answers: {}, hoursEdited: false, filter: '' };
}
function drawReport() {
  const d = S.report;
  if (!S.rform) S.rform = newReportForm();
  const f = S.rform, a = f.answers;
  const places = (d.office ? [d.office] : []).concat(d.sites);
  const recent = d.recent.map(id => places.find(s => s.id === id)).filter(Boolean);
  if (d.office && !recent.some(s => s.id === d.office.id)) recent.push(d.office);
  const filtered = d.sites.filter(s => !f.filter || (s.name + s.short).indexOf(f.filter) >= 0);
  const req = (it) => it.required ? '<span class="req">必須</span>' : '';
  const help = (it) => it.help ? '<p class="help">' + esc(it.help) + '</p>' : '';
  let h = S.reportHead();
  if (d.last) h += '<button class="quick" id="rLast" style="padding:10px 14px"><b style="font-size:16px;margin:0">前回の内容を入れる</b><span class="muted">' + esc(d.last.siteName) + '（日付・時間は今回の分を入れてください）</span></button><div style="height:10px"></div>';
  h += '<div class="card">' +
    '<label>日付<span class="req">必須</span></label><div class="seg">' +
    '<button data-rdate="' + today() + '" class="' + (f.date === today() ? 'on' : '') + '">今日 ' + esc(jpDate(today())) + '</button>' +
    '<button data-rdate="' + yesterday() + '" class="' + (f.date === yesterday() ? 'on' : '') + '">昨日</button></div>' +
    '<div style="height:8px"></div><input type="date" id="rdate" value="' + esc(f.date) + '" max="' + today() + '">' +
    '<label>現場' + (d.office ? '・' + esc(d.office.name) : '') + '<span class="req">必須</span></label>' +
    (recent.length ? '<div class="chips" style="margin-bottom:8px">' + recent.map(s => '<button class="chip ' + (f.siteId === s.id ? 'on' : '') + '" data-rsite="' + esc(s.id) + '">' + esc(s.short || s.name) + '</button>').join('') + '</div>' : '') +
    (d.sites.length > 8 ? '<input id="rfilter" placeholder="現場名で絞り込み" value="' + esc(f.filter) + '"><div style="height:8px"></div>' : '') +
    '<select id="rsite"><option value="">現場を選んでください</option>' +
    (d.office ? '<option value="' + esc(d.office.id) + '"' + (f.siteId === d.office.id ? ' selected' : '') + '>' + esc(d.office.name) + '</option>' : '') +
    filtered.map(s => '<option value="' + esc(s.id) + '"' + (f.siteId === s.id ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('') + '</select>';
  d.items.forEach((it, i) => {
    const v = a[it.id];
    h += '<label>' + esc(it.label) + req(it) + '</label>';
    if (it.type === '文字') h += '<input data-i="' + i + '" data-t="text" maxlength="200" value="' + esc(v || '') + '"' + (it.help && /^例/.test(it.help) ? ' placeholder="' + esc(it.help) + '"' : '') + '>' + (it.help && !/^例/.test(it.help) ? help(it) : '');
    else if (it.type === '数値') h += '<input data-i="' + i + '" data-t="num" type="number" inputmode="decimal" value="' + esc(v === undefined ? '' : v) + '">' + help(it);
    else if (it.type === '1つ選ぶ') h += '<div class="chips">' + it.options.map(o => '<button class="chip ' + (v === o ? 'on' : '') + '" data-i="' + i + '" data-one="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div>' + help(it);
    else if (it.type === '複数選ぶ') h += '<div class="chips">' + it.options.map(o => '<button class="chip ' + ((v || []).indexOf(o) >= 0 ? 'on' : '') + '" data-i="' + i + '" data-many="' + esc(o) + '">' + esc(o) + '</button>').join('') + '</div><p class="help">いくつでも選べます</p>';
    else if (it.type === 'はい/いいえ') h += '<div class="seg">' + [['', 'なし'], ['1', 'あり']].map(x => '<button data-i="' + i + '" data-yn="' + x[0] + '" class="' + ((!!v) === (x[0] === '1') ? 'on' : '') + '">' + x[1] + '</button>').join('') + '</div>' + help(it);
    else if (it.type === '人数') h += '<div class="card" style="margin:0;padding:4px 12px">' + it.options.map(o => {
        const n = (v && v[o]) || 0;
        return '<div class="stepper"><span style="flex:1">' + esc(o) + '</span><button data-i="' + i + '" data-step="-1" data-o="' + esc(o) + '" aria-label="' + esc(o) + 'を減らす">−</button><span class="n" data-n="' + i + ':' + esc(o) + '">' + (n ? n + '人' : '−') + '</span><button data-i="' + i + '" data-step="1" data-o="' + esc(o) + '" aria-label="' + esc(o) + 'を増やす">＋</button></div>';
      }).join('') + '</div>' + help(it);
    else if (it.type === '時間') {
      const t = v || {};
      h += '<div class="row" style="align-items:center"><input type="time" data-i="' + i + '" data-tm="start" value="' + esc(t.start || '') + '" style="flex:1" aria-label="開始">' +
        '<span>〜</span><input type="time" data-i="' + i + '" data-tm="end" value="' + esc(t.end || '') + '" style="flex:1" aria-label="終了"></div>' +
        '<div class="between" style="margin-top:8px"><span class="muted" style="font-size:13px">時間数' + (d.breakMin ? '（6時間以上は休憩' + d.breakMin + '分を引く）' : '') + '</span>' +
        '<span style="display:flex;align-items:center;gap:6px"><input type="number" inputmode="decimal" step="0.25" min="0" max="24" data-i="' + i + '" data-tm="hours" value="' + esc(t.hours === undefined ? '' : t.hours) + '" style="width:96px;text-align:right"><span style="white-space:nowrap">時間</span></span></div>';
    }
  });
  h += '<div style="height:16px"></div><button class="primary" id="rsave">日報を提出する</button></div>';
  $('app').innerHTML = h;
  bindReportHead();

  if ($('rLast')) $('rLast').onclick = () => {
    const keepTime = {};
    d.items.forEach(it => { if (it.type === '時間' && a[it.id]) keepTime[it.id] = a[it.id]; });
    f.answers = Object.assign(JSON.parse(JSON.stringify(d.last.answers || {})), keepTime);
    d.items.forEach(it => { if (it.type === '時間' && !keepTime[it.id]) delete f.answers[it.id]; });
    if (places.some(s => s.id === d.last.siteId)) f.siteId = d.last.siteId;
    drawReport(); toast('前回の内容を入れました。時間を入れてください');
  };
  document.querySelectorAll('[data-rdate]').forEach(b => b.onclick = () => { f.date = b.dataset.rdate; drawReport(); });
  $('rdate').onchange = (e) => { f.date = e.target.value; drawReport(); };
  document.querySelectorAll('[data-rsite]').forEach(b => b.onclick = () => { f.siteId = b.dataset.rsite; drawReport(); });
  $('rsite').onchange = (e) => { f.siteId = e.target.value; document.querySelectorAll('[data-rsite]').forEach(x => x.classList.toggle('on', x.dataset.rsite === f.siteId)); };
  if ($('rfilter')) $('rfilter').oninput = (e) => { f.filter = e.target.value; const pos = e.target.selectionStart; drawReport(); $('rfilter').focus(); $('rfilter').setSelectionRange(pos, pos); };
  const item = (el) => d.items[Number(el.dataset.i)];
  // 選ぶ部品は画面を描き直さずに見た目だけ切り替える（スクロール位置がずれないように）
  document.querySelectorAll('[data-t]').forEach(el => el.oninput = () => {
    const it = item(el); if (el.value === '') delete a[it.id]; else a[it.id] = el.dataset.t === 'num' ? Number(el.value) : el.value;
  });
  document.querySelectorAll('[data-one]').forEach(b => b.onclick = () => {
    const it = item(b), o = b.dataset.one;
    if (a[it.id] === o) delete a[it.id]; else a[it.id] = o;
    document.querySelectorAll('[data-one][data-i="' + b.dataset.i + '"]').forEach(x => x.classList.toggle('on', a[it.id] === x.dataset.one));

      }

  });
  $('rsave').onclick = () => {
    if (!f.siteId) return toast('現場を選んでください');

    if (miss) return toast('「' + miss.label + '」を入力してください');

  };
}
function saveReport(p, siteName) {

  $('app').innerHTML = '<div class="alert saving" id="saveState" style="font-size:17px;background:var(--accent-weak);color:var(--ink)"><b>保存しています</b><br>' +
    esc(jpDate(p.date) + ' ' + siteName) + '</div>' +
    '<button class="primary" id="again">続けて入力する（同じ日）</button><div style="height:8px"></div>' +
    '<button style="width:100%" id="toList">今月の日報を見る</button>' +
    (S.mode === 'liff' ? '<div style="height:8px"></div><button style="width:100%" id="close" disabled>保存が終わると閉じられます</button>' : '');
  window.scrollTo(0, 0);
  $('again').onclick = () => { S.rform = newReportForm({ date: p.date, siteId: '' }); S.rmode = 'input'; pageReport(); };
  $('toList').onclick = () => { S.rmode = 'list'; pageReport(); };
  act(async () => {
    let r;
    try { r = await api('addReport', p); }
    catch (e) {
      S.rform = backup;
      $('app').innerHTML = '<div class="alert ng" style="font-size:17px"><b>提出できませんでした</b><br>' + esc(e.message || String(e)) + '</div>' +
        '<button class="primary" id="retry">入力画面に戻る</button>';
      $('retry').onclick = () => { S.rmode = 'input'; pageReport(); };
      window.scrollTo(0, 0);

    }

    if (S.report) {
      S.report = Object.assign({}, S.report, { last: { siteId: r.siteId, siteName: r.siteName, answers: r.answers },
        recent: [r.siteId].concat((S.report.recent || []).filter(x => x !== r.siteId)).slice(0, 5) });
      S.data.rform = S.report;
      if (S.me && S.me.staff && S.me.staff.role === '従業員') cacheSet({ me: S.me, sites: S.sites });
    }
    const lk = 'rlist:' + r.date.slice(0, 7), list = S.data[lk];
    if (list) {
      const rows = [{ id: r.id, date: r.date, siteId: r.siteId, siteName: r.siteName, start: r.start, end: r.end, hours: r.hours, summary: r.summary, at: '' }].concat(list.rows)
        .sort((x, y) => y.date.localeCompare(x.date));
      S.data[lk] = Object.assign({}, list, { rows: rows, hours: Math.round((list.hours + (Number(r.hours) || 0)) * 100) / 100,
        days: rows.map(x => x.date).filter((v, i, arr) => arr.indexOf(v) === i).length });
    }
    const text = jpDate(r.date) + ' ' + r.siteName + (r.hours !== '' ? ' ' + r.start + '〜' + r.end + '（' + r.hours + '時間）' : '');
    if ($('saveState')) {
      $('saveState').outerHTML = '<div class="alert ok" id="saveState" style="font-size:17px"><b>提出しました ✓</b><br>' + esc(text) + '</div>';
      if ($('close')) { $('close').disabled = false; $('close').textContent = '閉じる'; $('close').onclick = () => liff.closeWindow(); }
    } else toast('日報を提出しました：' + text);
    if (S.mode === 'liff' && CONFIG.SEND_CHAT_MESSAGE && liff.isInClient()) {
      try { await liff.sendMessages([{ type: 'text', text: '【日報】' + text }]); } catch (e) { console.warn('sendMessages', e); }
    }
  });
}
function pageReportList() {
  const nav = monthNav('report', thisMonth(), pageReportList);
  view('rlist:' + nav.m, 'listReports', { month: nav.m }, d => drawReportList(d, nav));
}
function drawReportList(d, nav) {
  const key = 'rlist:' + nav.m;
  let h = S.reportHead() + nav.html +
    '<div class="card between"><span>' + d.days + '日・' + d.rows.length + '件</span><span class="big">' + d.hours + '時間</span></div>';
  if (!d.rows.length) h += '<div class="card"><p class="muted">この月の日報はありません。</p></div>';
  let lastDate = '';
  d.rows.forEach(r => {
    if (r.date !== lastDate) { if (lastDate) h += '</div>'; h += '<div class="dayhead"><span>' + esc(jpDate(r.date)) + '</span></div><div class="card">'; lastDate = r.date; }
    h += '<div class="item"><div class="between"><b>' + esc(r.siteName) + '</b><span>' + (r.hours !== '' ? esc(r.start + '〜' + r.end) + '　<b>' + esc(r.hours) + 'h</b>' : '') + '</span></div>' +
      '<div class="muted" style="margin-top:4px">' + esc(r.summary.split(' ／ ').filter(x => !/^\S+：\d{1,2}:\d{2}〜/.test(x)).join(' ／ ')) + '</div>' +
      '<div style="text-align:right;margin-top:6px"><button class="chip" data-rcancel="' + esc(r.id) + '">取り消す</button></div></div>';
  });
  if (lastDate) h += '</div>';
  h += '<p class="muted">間違えたときは取り消して入力し直してください。</p>';
  $('app').innerHTML = h;
  bindReportHead();
  nav.bind();
  document.querySelectorAll('[data-rcancel]').forEach(b => b.onclick = () => {
    const r = d.rows.find(x => x.id === b.dataset.rcancel);
    modal('<p style="margin-top:0">' + esc(jpDate(r.date) + ' ' + r.siteName) + ' の日報を取り消しますか？</p>' +
      '<div class="row"><button id="mNo">やめる</button><button id="mYes" class="primary" style="width:auto;background:var(--ng);border-color:var(--ng)">取り消す</button></div>');
    $('mNo').onclick = closeModal;
    $('mYes').onclick = () => {
      closeModal();
      const prev = S.data[key] || d;
      const rows = prev.rows.filter(x => x.id !== r.id);
      const opt = Object.assign({}, prev, { rows: rows, hours: Math.round((prev.hours - (Number(r.hours) || 0)) * 100) / 100,
        days: rows.map(x => x.date).filter((v, i, arr) => arr.indexOf(v) === i).length });
      S.data[key] = opt; drawReportList(opt, nav);
      act(async () => {
        try {
          const nd = await api('cancelReport', { id: r.id, month: nav.m });
          S.data[key] = nd; if (S.view === key) drawReportList(nd, nav); toast('取り消しました');
        } catch (e) { S.data[key] = prev; if (S.view === key) drawReportList(prev, nav); throw e; }
      });
    };
  });
}

/* ===== 事務：管理 ===== */
function pageAdmin() {
  const nav = monthNav('admin', addMonth(thisMonth(), -1), pageAdmin);
  view('admin:' + nav.m, 'adminSummary', { month: nav.m }, d => drawAdmin(d, nav));
}
function drawAdmin(d, nav) {
  const key = 'admin:' + nav.m;
  const c = d.counts;
  let h = '<h2>管理（事務）</h2>' + nav.html +
    '<div class="card"><table><tr><td>未承認</td><td class="r"><b>' + c.registered + '件</b></td></tr><tr><td>承認済（請求前）</td><td class="r">' + c.approved + '件</td></tr>' +
    '<tr><td>差戻</td><td class="r">' + c.rejected + '件</td></tr><tr><td>請求済</td><td class="r">' + c.billed + '件</td></tr></table></div>' +
    '<h3>登録申請中の一人親方</h3><div class="card">' + (d.applicants.length ? d.applicants.map(a =>
      '<div class="item between"><div><b>' + esc(a.name) + '</b>' + (a.trade ? '（' + esc(a.trade) + '）' : '') + '<div class="muted">' + esc(a.tel) + '・' + esc(a.at) + '</div></div>' +
      '<button class="chip" data-act="' + esc(a.id) + '">有効にする</button></div>').join('') : '<p class="muted">ありません。</p>') + '</div>' +
    '<h3>' + jpMonth(nav.m) + '分の請求書</h3><div class="card">' + (d.invoices.length ? d.invoices.map(i =>
      '<div class="item"><div class="between"><b>' + esc(i.name) + '</b><span class="badge b-' + esc(i.status) + '">' + esc(i.status) + '</span></div>' +
      '<div class="between"><span class="muted">' + esc(i.id) + '</span><b>' + esc(yen(i.total)) + '</b></div>' +
      (i.pdf ? (window.DEMO_HOOKS && String(i.pdf).indexOf('demo:') === 0 ? '<button class="chip" data-pdf="' + esc(i.pdf) + '">PDFを開く</button>' : '<a class="btn chip" target="_blank" rel="noopener" href="' + esc(i.pdf) + '">PDFを開く</a>') : '') + '</div>').join('') : '<p class="muted">まだ提出はありません。</p>') + '</div>' +
    (window.DEMO_HOOKS ? '<button style="width:100%" id="sheetView">スプレッドシートの中身を見る</button>' : '<a class="btn" style="width:100%" target="_blank" rel="noopener" href="' + esc(d.sheetUrl) + '">スプレッドシートを開く</a>') +
    '<p class="muted">現場（地域・住所）・親方のタグ・職員の招待コードはスプレッドシートで管理します。</p>';
  $('app').innerHTML = h;
  nav.bind();
  if (window.DEMO_HOOKS) {
    document.querySelectorAll('[data-pdf]').forEach(b => b.onclick = () => window.DEMO_HOOKS.showPdf(b.dataset.pdf));
    if ($('sheetView')) $('sheetView').onclick = () => window.DEMO_HOOKS.showSheets();
  }
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    b.disabled = true; b.textContent = '処理中…';
    act(async () => {
      try {
        const r = await api('activateOyakata', { id: b.dataset.act, month: nav.m });
        S.data[key] = r; if (S.view === key) drawAdmin(r, nav); toast('有効にしました');
      } catch (e) { if (S.view === key) drawAdmin(S.data[key] || d, nav); throw e; }
    });
  });
}

boot();
</script>
